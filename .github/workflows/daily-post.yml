name: Daily AI video post (TikTok + YouTube Shorts)

on:
  schedule:
    # O Brasil e UTC-3 (sem horario de verao). Tres publicacoes por dia, nos
    # horarios em que o publico costuma estar ativo. Precisa casar com
    # posting_hours_utc no config.yaml: e de la que o bot deduz qual publicacao
    # esta rodando, para cada uma pegar um tema diferente.
    - cron: "0 9 * * *"    # 06h de Brasilia, devocional da manha
    - cron: "0 15 * * *"   # 12h de Brasilia, horario de almoco
    - cron: "0 23 * * *"   # 20h de Brasilia, noite
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Se true, gera o video mas nao publica em nenhuma plataforma"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    # o formato em cenas gera uma imagem por cena e renderiza movimento de camera
    # quadro a quadro, entao o render leva bem mais que o do personagem fixo
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        env:
          # sem isso o Python bufferiza a saida (o passo do Actions e um pipe,
          # nao um terminal) e o log so aparece no fim. Se a execucao estourar
          # o timeout, ela e morta e o log vai junto, justo quando ele importa.
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # geram as imagens das cenas (a Pollinations passou a cobrar)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python main.py

      - name: Upload video gerado (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          # o metadata.json diz qual gancho e tema foram usados, para cruzar com
          # a retencao no YouTube Studio depois. O painel local baixa este
          # artifact para postar no TikTok, e o publicacao.json diz o que ja
          # saiu no YouTube (sem ele o painel ofereceria publicar de novo)
          path: |
            output/**/final.mp4
            output/**/thumbnail.jpg
            output/**/metadata.json
            output/**/publicacao.json
          retention-days: 14
