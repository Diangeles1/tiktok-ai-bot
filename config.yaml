      - "Neemias reconstruindo os muros sob ameaca"

    # Uma pessoa no centro: santo da tradicao ou figura que encontra Jesus.
    # E o grupo do meio-dia: 9 dos 30 videos.
    # Versículos do "Versículo do dia", o video da manha. Cada um traz a DOR
    # que ele atende, depois do travessao: e isso que faz a abertura falar com
    # quem está assistindo em vez de recitar. O versículo e dito com as
    # palavras do canal, nunca copiado de traducao moderna (direito autoral e
    # originalidade exigida pela monetizacao).
    versiculo:
      - "Isaías 41, versículo 10 — não temas, eu seguro a tua mão direita: para quem está com medo do futuro"
      - "Salmo 23, versículo 1 — o Senhor é o meu pastor: para quem se sente sem direcao"
      - "Salmo 46, versículo 1 — Deus é refugio e forca: para quem está passando por aperto"
      - "Salmo 91, versículo 1 — quem habita no abrigo do Altissimo: para quem está com medo de perder alguem"
      - "Mateus 11, versículo 28 — vinde a mim os que estão cansados: para quem está exausto de carregar tudo"
      - "Mateus 6, versículo 34 — não se preocupe com o amanha: para quem perde o sono pensando no mes que vem"
      - "João 14, versículo 27 — deixo-vos a paz: para quem está com o coracao agitado"
      - "Filipenses 4, versículo 13 — posso todas as coisas naquele que me fortalece: para quem acha que não vai dar conta"
      - "Filipenses 4, versículos 6 e 7 — não andeis ansiosos por nada: para quem convive com ansiedade"
      - "Romanos 8, versículo 28 — todas as coisas cooperam para o bem: para quem não entende o que está vivendo"
      - "Romanos 8, versículos 38 e 39 — nada nos separa do amor de Deus: para quem se sente indigno"
      - "Josué 1, versículo 9 — sê forte e corajoso: para quem precisa tomar uma decisao dificil"
      - "Jeremias 29, versículo 11 — eu sei os planos que tenho para voce: para quem sente que a vida travou"
      - "Provérbios 3, versículos 5 e 6 — confia de todo o coracao e não na tua propria esperteza: para quem quer controlar tudo"
      - "Salmo 34, versículo 18 — perto está o Senhor dos que têm o coracao quebrado: para quem está de luto"
      - "2 Timóteo 1, versículo 7 — Deus não deu espirito de medo: para quem vive com medo do que vem"
      - "Hebreus 11, versículo 1 — a fe e a certeza do que não se ve: para quem está esperando resposta"
      - "Lamentações 3, versículos 22 e 23 — a misericordia se renova cada manha: para quem acha que estragou tudo"
      - "Salmo 121, versículos 1 e 2 — de onde vem o meu socorro: para quem não tem a quem pedir ajuda"
      - "Mateus 5, versículo 4 — bem-aventurados os que choram, porque serão consolados: para quem está chorando hoje"
      - "Isaías 40, versículo 31 — os que esperam no Senhor renovam as forcas: para quem está no limite"
      - "1 Pedro 5, versículo 7 — lance sobre ele toda a sua ansiedade: para quem carrega preocupacao sozinho"
