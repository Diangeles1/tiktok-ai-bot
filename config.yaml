    # Temas do FORMATO LONGO. Lista propria, e isto tem motivo medido: em
    # 09/10/2026 o roteiro de cinco minutos sobre "a sogra de Pedro curada
    # da febre" (Lucas 4, DOIS versículos) saiu com 670 palavras, enquanto
    # o de Neemias reconstruindo os muros (capítulos 2 a 4) saiu com 762.
    # Não há 840 palavras honestas numa cura de dois versículos, e esticar
    # seria inventar, que é o oposto do que este canal faz. Aqui só entram
    # histórias de arco inteiro, com vários capítulos de material.
    longo:
      - "José vendido pelos irmãos até se tornar governador do Egito"
