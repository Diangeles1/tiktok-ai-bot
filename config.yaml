    # --- Antigo Testamento ---
    - "Noe construindo a arca diante do deboche de todos"
    - "A torre de Babel e a confusao das linguas"
    - "Abraao subindo o monte com Isaque"
    - "Jaco lutando a noite inteira com o anjo"
    - "Jose vendido pelos irmaos e sua ascensao no Egito"
    - "Moises e a sarca que ardia sem se consumir"
    - "Moises e a travessia do Mar Vermelho"
    - "As muralhas de Jerico caindo apos sete voltas"
