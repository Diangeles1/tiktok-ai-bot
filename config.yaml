      - "Moisés e as dez pragas, do confronto com o faraó à primeira Páscoa"
      - "A travessia do Mar Vermelho e os primeiros dias no deserto"
      - "Davi e Golias, e a perseguição de Saul que veio depois"
      - "Jó: a perda de tudo, os amigos que acusaram e a resposta de Deus"
      - "Daniel na cova dos leões e os sonhos que ele interpretou na Babilônia"
      - "Jonas, a fuga, o grande peixe e a cidade de Nínive"
      - "Ester arriscando a vida para salvar o próprio povo"
      - "Rute e Noemi, da fome em Moabe à colheita em Belém"
      - "Neemias reconstruindo os muros de Jerusalém sob ameaça"
      - "Elias no monte Carmelo e a fuga até o monte Horebe"
