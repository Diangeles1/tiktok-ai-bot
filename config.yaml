captions:
  words_per_chunk: 3    # quantas palavras aparecem por vez na legenda animada
  bottom_margin: 420    # distancia da legenda ate a base, em px (a interface do TikTok cobre o rodape)

# Capa do video (so o YouTube aceita capa customizada; o TikTok usa um quadro
# do proprio video). Exige canal verificado por telefone: se nao estiver, o bot
# avisa e segue, sem perder a publicacao.
thumbnail:
  enabled: true
  max_lines: 3    # em quantas linhas o texto de impacto pode ser quebrado

sfx:
  laugh_enabled: false     # risada de grupo no fim (assets/laughs/*.mp3). Combina com humor, nao com historia seria
  laugh_gap_seconds: 0.4   # pausa entre o fim da narracao e o inicio da risada
  # Assinatura de voz: gravacoes suas fechando o video ("gostou? se inscreve no
  # canal"), sorteadas a cada video, em assets/voz/. Alem de assinatura do
  # canal, e a camada humana que a politica de conteudo nao autentico do
  # YouTube cobra de quem produz com IA. Pasta vazia = sem assinatura.
  assinatura_enabled: true
  assinatura_gap_seconds: 0.45   # pausa entre o fim da narracao e a sua voz
  # Trilha sorteada dentro de assets/music/<clima>/, onde <clima> e o tom geral
  # que o proprio roteiro classifica (tenso, triunfante ou calmo: ver o campo
  # "clima" em src/script_gen.py). Pasta do clima vazia cai para assets/music/calmo/.
  music_enabled: true
  music_volume: 0.06       # volume da trilha por baixo da narracao (0 a 1); baixado de 0.10 apos feedback de que estava alta
  # Efeitos de cena (assets/sfx/*.mp3): cada cena pode puxar um ambiente bem
  # baixo (chuva, agua, multidao, vento...) pela propria descricao visual dela
  # (ver src/sfx.py _AMBIENCE_KEYWORDS), preso a duracao so daquela cena, e a
  # ultima ganha um efeito curto de virada (fanfarra ou impacto) batendo com o
  # clima. Historia "calma" nao ganha efeito de virada: nao ha virada para marcar.
  sfx_enabled: true

tiktok:
  enabled: true
  privacy_level: "SELF_ONLY"  # apps nao auditados so podem postar como SELF_ONLY (rascunho privado)
  # "upload": o video cai na caixa de entrada do app e VOCE finaliza a postagem
  #   no celular, escolhendo legenda, som e privacidade. Como quem publica e
  #   voce, sai publico mesmo com o app ainda nao auditado. Exige o escopo
  #   video.upload. Limite: 5 envios pendentes em 24h, entao finalize os
  #   rascunhos todo dia, senao a partir do segundo dia o envio falha.
  # "direct": o bot publica sozinho, mas app nao auditado so posta privado
  #   (SELF_ONLY). Exige video.publish.
  # Vale para o horario automatico. O TikTok pede que a pessoa confirme cada
  # post, entao publicar direto e com a tela do painel (painel_direto).
  mode: "upload"
  # O painel mostra a tela de publicar direto no perfil, com tudo que a
  # revisao do app exige: conta que vai receber, quem pode ver (sem opcao
  # pre-escolhida), comentario/dueto/costura, divulgacao comercial, rotulo de
  # conteudo gerado por IA e o aviso da Confirmacao de Uso de Musica.
  # Precisa do Direct Post ligado no app do TikTok for Developers e da conta
  # reconectada depois disso (o escopo video.publish entra no pedido).
  painel_direto: true
  # true depois que o TikTok aprovar o app: o painel passa a abrir na
  # publicacao direta em vez de mandar para o app do celular.
  app_aprovado: false
  # false: o horario automatico do GitHub nao manda nada para o TikTok. O
  # video fica no painel (que baixa os videos do automatico) e voce posta de
  # la. Com true, cada horario manda para a caixa de entrada do celular.
  automatico: false

youtube:
  enabled: true
  # declara "conteudo alterado ou sintetico" em cada envio (imagens e narracao
  # sao de IA). E exigencia do YouTube, e desde 2026 a politica de conteudo nao
  # autentico vale para o canal inteiro: declarar faz parte de seguir
  # monetizavel. So desligue se um dia o video for 100% gravado por voce.
  conteudo_sintetico: true
  # true: o video sobe privado com a hora exata marcada (publishAt) e o YouTube
  # publica no minuto certo. E o que corrige o atraso do GitHub Actions, que
  # comeca o agendamento de minutos a horas depois da hora. Exige que o
  # workflow rode ANTES do horario (ver os cron em daily-post.yml).
  agendar: true
  privacy_status: "public"    # public | unlisted | private
  category_id: "22"           # 22 = People & Blogs (nao existe categoria de religiao). Lista: https://developers.google.com/youtube/v3/docs/videoCategories/list
  made_for_kids: false

# Cada video sai com no maximo hashtags_max hashtags: as fixas abaixo, que
# sao as de maior volume do nicho cristao em portugues, e a vaga que sobra
# fica com a do video (personagem ou tema da historia, gerada pelo LLM), que
# e a que leva quem procura aquela historia. As fixas vem primeiro porque o
# YouTube exibe as tres primeiras ao lado do titulo.
# Nao use #fyp, #viral ou #foryou: nao dizem do que o video trata, e o
# YouTube avisa que exagerar em tag pode tirar o video da busca.
# Repetidas e acentos sao limpos automaticamente (ver src/hashtags.py).
hashtags_max: 4
hashtags_extra:
  - "#Jesus"
  - "#Deus"
  - "#Biblia"
